# Windows installer and updates for QA-STE100-Studio.
# Icons:   npm run icons     (draws build/icon.png and the installer images)
# Build:   npm run dist      (installers in dist/)
# Release: set GH_TOKEN, then npm run release (uploads to GitHub Releases; the app updates from there)
# Kept from the earlier name (QA-ASD-STE100): Windows knows installed copies by it, so updates keep working.
appId: com.qa-asd-ste100.app
productName: QA-STE100-Studio
copyright: Copyright © 2026 Beniamin Zotescu
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# These run as separate programs, so they must not stay inside the packed archive.
asarUnpack:
  - node_modules/playwright-core/**
  # The test runner and Claude's browser tool, run on the app's Electron (src/main/nodeRunner.ts).
  - node_modules/playwright/**
  - node_modules/@playwright/**
  - node_modules/@anthropic-ai/claude-agent-sdk/**
  # Claude Code itself for API key mode (a program, so it can't run from inside the archive).
  - node_modules/@anthropic-ai/claude-agent-sdk-win32-x64/**

win:
  icon: build/icon.png
  # The small installer people get: it downloads the app (with a progress bar), then installs it.
  # The full installer for computers without internet: npm run dist:offline (not published, so the
  # two installers' update files don't overwrite each other in a release).
  target:
    - target: nsis-web
      arch: x64

# Shared by both installers: a wizard, not a one-click install.
nsis: &installer
  oneClick: false
  # The wizard asks "Only for me" or "Anyone who uses this computer" (the second asks Windows for permission).
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: QA-STE100-Studio
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  runAfterFinish: true
  # A reinstall starts clean (build/installer.nsh); uninstalling removes the app's data too.
  # In-app updates keep everything: both steps skip it when the installer runs as an update.
  include: build/installer.nsh
  deleteAppDataOnUninstall: true
  artifactName: ${productName}-Offline-Setup-${version}.${ext}

nsisWeb:
  <<: *installer
  artifactName: ${productName}-Setup-${version}.${ext}

publish:
  provider: github
  # A separate PUBLIC repository holds only the installers and update files, so the source
  # (beniaminzotescu/qa-automation-tool) stays private and the app needs no token to update.
  owner: beniaminzotescu
  repo: qa-automation-tool-releases
